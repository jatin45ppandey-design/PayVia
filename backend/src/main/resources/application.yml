spring:
  application:
    name: Payvia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payvia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.payvia: INFO
